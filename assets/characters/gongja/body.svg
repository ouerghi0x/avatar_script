<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Pale Neck -->
  <rect x="175" y="220" width="50" height="45" rx="8" fill="#F0CBB0" stroke="#111827" stroke-width="6"/>
  
  <!-- Kim Gong-ja's Hunter Trench Coat / Dark Ragged Jacket -->
  <polygon points="105,255 295,255 330,480 70,480" fill="#181822" stroke="#111827" stroke-width="8"/>
  
  <!-- Inner Ash-Gray Hoodie / Tattered Shirt -->
  <polygon points="145,255 255,255 265,480 135,480" fill="#2E3440" stroke="#111827" stroke-width="6"/>
  
  <!-- Deep Inner T-Shirt (V-Neck) -->
  <polygon points="165,250 235,250 200,315" fill="#4C566A" stroke="#111827" stroke-width="5"/>
  
  <!-- Coat Collar & Lapels -->
  <polygon points="105,255 155,255 175,340 130,340" fill="#232731" stroke="#111827" stroke-width="5"/>
  <polygon points="295,255 245,255 225,340 270,340" fill="#232731" stroke="#111827" stroke-width="5"/>

  <!-- Leather Chest Harness / Utility Strap -->
  <line x1="125" y1="280" x2="275" y2="440" stroke="#3B4252" stroke-width="10" stroke-linecap="round"/>
  <rect x="190" y="345" width="22" height="28" rx="4" fill="#D8DEE9" stroke="#111827" stroke-width="3"/>
</svg>
